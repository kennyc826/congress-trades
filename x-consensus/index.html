const tkBtn = (tk, cls = '') => `<button class="tk ${cls}" data-drill="${esc(tk)}">${esc(tk)}</button>`;
const ORDER = {bull: 0, neutral: 1, bear: 2};
let VIEW = 'today', DRILL = null, DRILL_W = 7, SORT = {key: 'bullSig', dir: -1};

const between = (from, to) => OPS.filter(o => o.ts >= from && o.ts <= to);
function rangeFor(v) {
  if (v === 'week') return {days: 7, ops: between(NOW - 7 * DAY, NOW)};
  if (v === 'month') return {days: 28, ops: between(NOW - 28 * DAY, NOW)};
  let days = 1, ops = between(NOW - DAY, NOW);
  if (ops.filter(o => o.stance !== 'neutral').length < 3) { days = 2; ops = between(NOW - 2 * DAY, NOW); }
  return {days, ops};
}

function groups(ops) {
  const by = {};
  for (const o of ops) {
    const g = by[o.ticker] ??= {tk: o.ticker, latest: {}, all: []};
    g.latest[o.handle] = o; g.all.push(o);
  }
  return Object.values(by).map(g => {
    const L = Object.values(g.latest);
    const bull = L.filter(o => o.stance === 'bull'), bear = L.filter(o => o.stance === 'bear');
    const kind = bull.length && bear.length ? 'split' : bull.length >= 2 ? 'bull' : bear.length >= 2 ? 'bear' : 'other';
    return {...g, L, bull, bear, neu: L.length - bull.length - bear.length, kind, mentions: g.all.length,
      bullSig: g.all.filter(o => o.stance === 'bull').length, bearSig: g.all.filter(o => o.stance === 'bear').length};
  });
}

function viewCard(g, cls, title) {
  const rows = g.L.slice().sort((a, b) => ORDER[a.stance] - ORDER[b.stance] || b.ts - a.ts);

}

function changes(days) {
  const prev = {}, out = {}, start = NOW - days * DAY;
  for (const o of OPS) {
    const k = o.handle + '|' + o.ticker, p = prev[k];
    let kind = null, cls = '';
    if (p && p.stance !== o.stance) {
      if (p.stance !== 'neutral' && o.stance !== 'neutral') [kind, cls] = ['反轉', 'flip'];
      else if (o.stance === 'neutral') [kind, cls] = ['轉中性', 'down'];
      else [kind, cls] = ['表態', o.stance === 'bull' ? 'up' : 'down'];
    } else if (p && o.stance !== 'neutral' && o.strength !== p.strength) {
      [kind, cls] = o.strength > p.strength ? ['加強', o.stance === 'bull' ? 'up' : 'down'] : ['減弱', 'down'];
    }
    if (kind && o.ts >= start) out[k] = {o, p, kind, cls};
    prev[k] = o;
  }
  return Object.values(out).sort((a, b) => b.o.ts - a.o.ts);
}

  $('view').innerHTML = `

function renderWeek() {
  const {ops} = rangeFor('week');
  const G = groups(ops);
  const prev = between(NOW - 14 * DAY, NOW - 7 * DAY), pc = {};
  for (const o of prev) pc[o.ticker] = (pc[o.ticker] || 0) + 1;
  G.forEach(g => g.d = g.mentions - (pc[g.tk] || 0));
  const multi = G.filter(g => g.L.length >= 2).sort((a, b) => b.L.length - a.L.length || b.mentions - a.mentions);
  const kindTitle = g => g.kind === 'split' ? `${g.bull.length} 睇好 · ${g.bear.length} 睇淡` : g.kind === 'bull' ? `${g.bull.length} 個帳號睇好` : g.kind === 'bear' ? `${g.bear.length} 個帳號睇淡` : `${g.L.length} 個帳號提及`;
  const focus = ACCS.map(a => {
    const mine = ops.filter(o => o.handle === a.handle), d = mine.length - prev.filter(o => o.handle === a.handle).length;
    const c = {};
    for (const o of mine) { const x = c[o.ticker] ??= {n: 0, b: 0, r: 0}; x.n++; if (o.stance === 'bull') x.b++; if (o.stance === 'bear') x.r++; }
    const top = Object.entries(c).sort((x, y) => y[1].n - x[1].n).slice(0, 5);
    return `<div class="box"><div class="acc-h"><div><strong>${esc(a.name)}</strong> <span class="h">@${esc(a.handle)}</span></div>
      <span class="num">${mine.length} 次 ${deltaSpan(d)}</span></div>

      const n = g.L.length;
      return `<tr><td>${tkBtn(g.tk)}</td><td><div class="split"><div class="bar"><i class="b" style="width:${g.bull.length / n * 100}%"></i><i class="n" style="width:${g.neu / n * 100}%"></i><i class="r" style="width:${g.bear.length / n * 100}%"></i></div>
        <div class="lbl"><span class="up">${g.bull.length} 睇好</span><span class="muted">${g.neu} 中性</span><span class="down">${g.bear.length} 睇淡</span></div></div></td>
        <td class="num">${g.mentions}</td><td>${deltaSpan(g.d)}</td><td>${pct(PX[g.tk]?.r28)}</td><td class="why">${esc(g.L.map(o => nm(o.handle)).join('、'))}</td></tr>`;
    }).join('')}</tbody></table></div>` : '<p class="empty">冇數據。</p>'}
    <h2>每個帳號本週焦點<span class="n">提及次數（同上週比）；綠＝睇好為主、紅＝睇淡為主</span></h2>
    <div class="grid g4">${focus}</div>

}

function consistency(os) {
  const by = {};
  for (const o of os) (by[o.ticker] ??= []).push(o.stance);
  const scored = Object.values(by).filter(s => s.length >= 2);
  if (!scored.length) return null;
  return scored.reduce((sum, s) => { const c = {}; s.forEach(x => c[x] = (c[x] || 0) + 1); return sum + Math.max(...Object.values(c)) / s.length; }, 0) / scored.length;
}

function renderMonth() {
  const {ops} = rangeFor('month');
  const G = groups(ops);
  const bullN = ops.filter(o => o.stance === 'bull').length, bearN = ops.filter(o => o.stance === 'bear').length;

    const best = Object.entries(c).filter(([, v]) => v.b > 0).sort((x, y) => y[1].b - x[1].b || y[1].n - x[1].n || y[1].last - x[1].last)[0];
    return `<div class="box"><div><strong>${esc(a.name)}</strong> <span class="muted" style="font-size:12px">@${esc(a.handle)}</span></div>

        <div class="muted" style="font-size:12px">睇好 ${best[1].b} · 總提及 ${best[1].n}</div>` : '<p class="empty">本月冇明確睇好嘅股</p>'}</div>`;

  const rows = G.map(g => { const s = g.bullSig + g.bearSig; return {...g, bp: s ? g.bullSig / s : null, r1y: PX[g.tk]?.r1y ?? null, r28: PX[g.tk]?.r28 ?? null}; });
  const val = x => x == null ? -1e9 : x;
  rows.sort((a, b) => (val(a[SORT.key]) - val(b[SORT.key])) * SORT.dir || b.mentions - a.mentions);

  const accRows = ACCS.map(a => {

  $('view').innerHTML = `

    <div class="grid g4">${stat('總提及', ops.length)}${stat('睇好', `<span class="up">${bullN}</span>`)}${stat('睇淡', `<span class="down">${bearN}</span>`)}${stat('睇好比例', bullN + bearN ? Math.round(bullN / (bullN + bearN) * 100) + '%' : '—')}</div>
    <h2>每個帳號本月最睇好嘅股<span class="n">按明確睇好次數排，再睇總提及同最近一次</span></h2>
    <div class="grid g4">${tops}</div>
    <h2>股票總表<span class="n">撳表頭排序</span></h2>
    ${rows.length ? `<div class="scroll"><table><thead><tr><th>股票</th>${th('bp', '多空比例')}${th('r1y', '一年回報')}${th('r28', '28 日回報')}${th('mentions', '提及')}${th('bullSig', '睇好')}${th('bearSig', '睇淡')}</tr></thead><tbody>${rows.map(g => `<tr>
      <td>${tkBtn(g.tk)}</td>
      <td>${g.bp == null ? '<span class="muted">只有提及</span>' : `<div class="split"><div class="bar"><i class="b" style="width:${g.bp * 100}%"></i><i class="r" style="width:${(1 - g.bp) * 100}%"></i></div><div class="lbl"><span class="up">${Math.round(g.bp * 100)}% 睇好</span><span class="down">${Math.round((1 - g.bp) * 100)}% 睇淡</span></div></div>`}</td>
      <td>${pct(g.r1y)}</td><td>${pct(g.r28)}</td><td class="num">${g.mentions}</td><td class="num up">${g.bullSig}</td><td class="num down">${g.bearSig}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">冇數據。</p>'}
    <h2>帳號立場一致性<span class="n">同一隻股講過兩次以上，立場有幾一致；反轉＝睇好同睇淡之間轉換</span></h2>

function priceChart(tk, ops) {
  const p = PX[tk];
  if (!p || !p.series || p.series.length < 2) return '<p class="empty">冇股價資料（可能係非美股、ETF 以外嘅代號或者私人公司）。</p>';
  const at = d => Date.parse(d + 'T21:00:00Z');
  const S = p.series.map(([d, v]) => ({t: at(d), d, v}));
  const W = 760, H = 210, L = 50, R = 14, T = 14, B = 26;
  const lo = Math.min(...S.map(s => s.v)), hi = Math.max(...S.map(s => s.v)), pad = (hi - lo) * .1 || hi * .02;
  const y0 = lo - pad, y1 = hi + pad, t0 = S[0].t, t1 = S[S.length - 1].t;
  const X = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const line = S.map((s, i) => `${i ? 'L' : 'M'}${X(s.t).toFixed(1)},${Y(s.v).toFixed(1)}`).join('');
  const ticks = [y0 + (y1 - y0) * .15, (y0 + y1) / 2, y1 - (y1 - y0) * .15];
  const byDay = {};
  for (const o of ops) { const d = new Date(o.ts).toISOString().slice(0, 10); if (at(d) >= t0 - DAY) (byDay[d] ??= []).push(o); }
  const marks = Object.entries(byDay).map(([d, os]) => {
    const near = S.reduce((best, s) => Math.abs(s.t - at(d)) < Math.abs(best.t - at(d)) ? s : best, S[0]);
    const b = os.filter(o => o.stance === 'bull').length, r = os.filter(o => o.stance === 'bear').length;
    const col = b > r ? 'var(--bull)' : r > b ? 'var(--bear)' : 'var(--neu)';
    return `<circle cx="${X(near.t).toFixed(1)}" cy="${Y(near.v).toFixed(1)}" r="5.5" fill="var(--surface)" stroke="${col}" stroke-width="2.5"><title>${d}：${esc(os.map(o => nm(o.handle) + ' ' + LABEL[o.stance]).join('、'))}</title></circle>`;
  }).join('');
  const mid = S[Math.floor(S.length / 2)];
  const fmt = v => v >= 100 ? v.toFixed(0) : v.toFixed(2);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tk)} 近 28 日收市價">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`).join('')}
    <path d="${line}L${X(t1).toFixed(1)},${H - B}L${L},${H - B}Z" fill="var(--chip)" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--ink-2)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${X(t1).toFixed(1)}" cy="${Y(S[S.length - 1].v).toFixed(1)}" r="3" fill="var(--ink)"/>
    ${marks}
    <text x="${L}" y="${H - 6}">${S[0].d.slice(5)}</text><text x="${X(mid.t).toFixed(1)}" y="${H - 6}" text-anchor="middle">${mid.d.slice(5)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${S[S.length - 1].d.slice(5)}</text>
  </svg><div class="muted" style="font-size:12px">圓圈＝嗰日有帳號發表觀點（綠＝睇好多、紅＝睇淡多、灰＝中性）；滑鼠停喺圓圈睇邊個。</div></div>`;
}

function renderDrill() {
  if (!DRILL) { $('drill').innerHTML = ''; return; }
  const tk = DRILL, p = PX[tk], allT = OPS.filter(o => o.ticker === tk);
  const win = between(NOW - DRILL_W * DAY, NOW).filter(o => o.ticker === tk);
  const per = {}; for (const o of win) (per[o.handle] ??= []).push(o);
  const GA = {bullOnly: [], bearOnly: [], mixed: [], unclear: [], none: []};
  for (const a of ACCS) {
    const os = per[a.handle];
    if (!os) { GA.none.push(a); continue; }
    const hb = os.some(o => o.stance === 'bull'), hr = os.some(o => o.stance === 'bear');
    (hb && hr ? GA.mixed : hb ? GA.bullOnly : hr ? GA.bearOnly : GA.unclear).push(a);
  }
  const seg = [['bullOnly', '只睇好', 'b'], ['bearOnly', '只睇淡', 'r'], ['mixed', '好淡都有', 'n'], ['unclear', '唔明確', 'n'], ['none', '冇提及', 'x']];
  const rows = ACCS.filter(a => per[a.handle]).map(a => {
    const os = per[a.handle], b = os.filter(o => o.stance === 'bull').length, r = os.filter(o => o.stance === 'bear').length, n = os.length - b - r;
    const lo = os[os.length - 1], c = consistency(allT.filter(o => o.handle === a.handle));
    return `<tr><td><strong>${esc(a.name)}</strong></td><td class="num">${os.length}</td><td class="num up">${b}</td>
      <td><div class="bar" style="width:90px"><i class="b" style="width:${b / os.length * 100}%"></i><i class="n" style="width:${n / os.length * 100}%"></i><i class="r" style="width:${r / os.length * 100}%"></i></div></td>
      <td class="num down">${r}</td><td class="num">${c == null ? '<span class="muted">—</span>' : Math.round(c * 100) + '%'}</td>
      <td class="why"><span class="pill ${lo.stance === 'bull' ? 'bull' : lo.stance === 'bear' ? 'bear' : 'neu'}">${LABEL[lo.stance]}</span> ${md(lo.ts)}：${esc(lo.summary)} ${post(lo)}</td></tr>`;
  }).join('');
  const c = D.congress?.[tk];
  const winRet = (() => { if (!p?.series) return null; const s = p.series.filter(([d]) => Date.parse(d) >= NOW - DRILL_W * DAY - DAY); return s.length >= 2 ? s[s.length - 1][1] / s[0][1] - 1 : null; })();
  const wLabel = DRILL_W === 1 ? '今日' : `近 ${DRILL_W} 日`;
  $('drill').innerHTML = `<h2>個股追查<span class="n">喺上面撳任何股票代號就會換</span></h2><div class="box" style="display:grid;gap:18px">
    <div class="drill-h"><span class="t">${esc(tk)}</span>
      ${p ? `<span class="px">${p.last} · ${pct(p.r1d)} <span class="muted">今日</span> · ${pct(p.r28)} <span class="muted">28 日</span> · ${pct(p.r1y)} <span class="muted">一年</span></span>` : ''}
      <span class="seg" style="margin-left:auto" role="group" aria-label="追查時間範圍">${[[1, '今日'], [7, '近 7 日'], [28, '近 28 日']].map(([w, t]) => `<button data-dw="${w}" aria-pressed="${w === DRILL_W}">${t}</button>`).join('')}</span></div>
    <div><h3 style="margin-bottom:6px">股價走勢 <span class="muted" style="font-weight:400">近 28 日收市價</span></h3>${priceChart(tk, allT)}</div>
    <div style="display:grid;gap:8px"><h3>${ACCS.length} 個帳號觀點 <span class="muted" style="font-weight:400">${wLabel}</span></h3>
      <div class="bar" style="height:10px">${seg.map(([k, , cls]) => GA[k].length ? `<i class="${cls}" style="width:${GA[k].length / ACCS.length * 100}%"></i>` : '').join('')}</div>
      <div class="stance-groups">${seg.map(([k, t]) => `<span class="g"><span class="muted">${GA[k].length} 人${t}</span>${k !== 'none' ? GA[k].map(a => `<span class="chipn">${esc(a.name)}</span>`).join('') : ''}</span>`).join('')}</div></div>
    <div class="grid g4">${stat('參與帳號', Object.keys(per).length)}${stat('提及', win.length)}${stat('睇好訊號', `<span class="up">${win.filter(o => o.stance === 'bull').length}</span>`)}${stat('同期股價', winRet == null ? '<span class="muted">—</span>' : pct(winRet))}</div>
    <div><h3 style="margin-bottom:6px">帳號明細 <span class="muted" style="font-weight:400">${wLabel}；冇提及嘅帳號唔當中性</span></h3>
      ${rows ? `<div class="scroll"><table><thead><tr><th>帳號</th><th>提及</th><th>睇好</th><th>立場組合</th><th>睇淡</th><th>立場一致性</th><th>最新觀點同理由</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="empty">呢段時間冇帳號講過呢隻股，試下揀長啲嘅時間範圍。</p>'}</div>
    <div><h3 style="margin-bottom:6px">觀點演變 <span class="muted" style="font-weight:400">全部 ${allT.length} 條，新到舊</span></h3>
      <ul class="tl">${allT.slice().reverse().map(o => `<li><span class="muted num">${md(o.ts)}</span><strong>${esc(nm(o.handle))}</strong>
        <span><span class="pill ${o.stance === 'bull' ? 'bull' : o.stance === 'bear' ? 'bear' : 'neu'}">${LABEL[o.stance]}${o.stance !== 'neutral' ? ' ' + '●'.repeat(o.strength) : ''}</span> ${esc(o.summary)} ${post(o)}</span></li>`).join('')}</ul></div>
    ${c ? `<div class="muted" style="font-size:12.5px">國會議員申報（近 90 日）：<span class="up">買 ${c.b}</span> / <span class="down">賣 ${c.s}</span>（${esc(c.people.slice(0, 4).join('、'))}${c.people.length > 4 ? '…' : ''}）</div>` : ''}
  </div>`;
}

(async () => {
  if (!window.claude?.use) return;
  const sample = await window.claude.use('sample');
  if (!sample) return;
  $('ask-sec').hidden = false;
  const q = $('ask-q'), go = $('ask-go'), stop = $('ask-stop'), out = $('ask-out');
  let ctl = null, blocked = false;
  const COPY = {not_granted: '你冇批准使用 Claude，所以答唔到。', rate_limited: '問得太密，等一陣再試。',
    prompt_too_large: '資料太多，暫時答唔到。', sampling_disabled: '呢個帳戶用唔到 AI 問答。'};
  async function ask(question) {
    if (!question.trim() || blocked) return;
    const ops = between(NOW - 28 * DAY, NOW);
    const lines = ops.map(o => `${new Date(o.ts).toISOString().slice(0, 10)} ${nm(o.handle)}(@${o.handle}) ${o.ticker} ${LABEL[o.stance]}${o.stance !== 'neutral' ? '強度' + o.strength : ''}：${o.summary}`);
    const px = Object.entries(PX).map(([t, v]) => `${t}: 今日${(v.r1d * 100).toFixed(1)}% 28日${v.r28 == null ? '—' : (v.r28 * 100).toFixed(1) + '%'} 一年${v.r1y == null ? '—' : (v.r1y * 100).toFixed(1) + '%'}`);
    const an = Object.entries(D.analyses || {}).slice(-3).map(([d, t]) => `${d}：${t}`);
    const prompt = `你係整理 X 交易員觀點嘅研究助手。只可以根據下面資料答；資料冇嘅就講冇，唔好估。
優先做跨帳號比較（邊個睇好、邊個睇淡、理由點唔同），唔好淨係數提及次數。
分三層睇：而家立場（每個帳號最新表態同理由）、近期變化（加強／減弱／反轉）、歷史背景（以前講過嘅點解釋而家）。
如果只有少數帳號講過，要講明證據有限；冇提過嘅帳號唔可以當中性。
用廣東話、簡潔答，註明邊個帳號幾時講。唔好畀買賣建議、目標價或者「值得買」之類評價。

追蹤帳號：${ACCS.map(a => `${a.name}(@${a.handle}，${TYPE[a.type] || ''})`).join('、')}
資料截至：${D.generated}

【近 28 日逐條觀點】
${lines.join('\n') || '（冇）'}

【股價】
${px.join('\n') || '（冇）'}

【每日分析】
${an.join('\n') || '（冇）'}

問題：${question}`;
    ctl = new AbortController();
    go.disabled = true; stop.hidden = false; out.textContent = '諗緊…';
    try {
      await sample(prompt, {signal: ctl.signal, onText: ({text}) => { out.textContent = text; }});
    } catch (e) {
      out.textContent = e.text || '';
      if (e.code !== 'cancelled') out.textContent += (out.textContent ? '\n\n' : '') + (COPY[e.code] || '暫時答唔到，稍後再試。');
      if (e.code === 'not_granted' || e.code === 'sampling_disabled') blocked = true;
    } finally { go.disabled = blocked; stop.hidden = true; }
  }
  go.onclick = () => ask(q.value);
  stop.onclick = () => ctl?.abort();
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask(q.value); });
  document.querySelectorAll('#ask-sec [data-q]').forEach(b => b.onclick = () => { q.value = b.dataset.q; ask(b.dataset.q); });
})();
})();
</script>
